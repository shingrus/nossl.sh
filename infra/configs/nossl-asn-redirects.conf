# ASN pages and rankings moved to openipdata.org (301).
# Installed as /etc/nginx/snippets/nossl-asn-redirects.conf and included in
# both the nossl.sh and *.nossl.sh server blocks of nginx.conf.
# Regex locations match in order, so include this above other regex locations.
# Captures are limited to safe characters so nothing raw lands in Location.
location ~* ^/(as[0-9]+/?)$ {
  return 301 https://openipdata.org/$1$is_args$args;
}
location ~ ^/(asn-[A-Za-z0-9._-]+/?)$ {
  return 301 https://openipdata.org/$1$is_args$args;
}
location ~* ^/api/as([0-9]+/?)$ {
  return 301 https://openipdata.org/api/as$1$is_args$args;
}
location ~ ^/(top-asn-by-ip-address|top-asn-by-ipv6|top-organizations-by-ip-address|list-of-countries-by-ipv4-allocation)/?$ {
  return 301 https://openipdata.org/$1$is_args$args;
}
location ~ ^/top-countries-by-ip-address/?$ {
  return 301 https://openipdata.org/list-of-countries-by-ipv4-allocation;
}
# Query string dropped on purpose: ?page=N does not exist on the new site.
location ~ ^/([a-z0-9-]+-asn-list)/?$ {
  return 301 https://openipdata.org/$1;
}
