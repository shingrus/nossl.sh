server {
  listen 80;
  listen [::]:80;
  server_name nossl.sh;

  proxy_hide_header Strict-Transport-Security;
  
  # Serve these over http://nossl.sh
  location ~ ^/(?:$|api(?:/.*)?$|status/[0-9]+/?$|healthz$|sitemap.xml$) {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $remote_addr;   
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  

  # everything else
  location / {
       proxy_pass http://127.0.0.1:8080;
       proxy_set_header Host $host;
       #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Real-IP        $remote_addr;
       proxy_set_header X-Forwarded-For  $remote_addr;  
       proxy_set_header X-Forwarded-Proto $scheme;
 #     return 301 https://s.nossl.sh$request_uri;
  }
}
server {
  listen 80;
  listen [::]:80;
  server_name *.nossl.sh;   # subdomains only (NOT nossl.sh)

  proxy_hide_header Strict-Transport-Security;

  set $cors_origin "";
  if ($http_origin ~* ^https?://(nossl\.sh|v4\.nossl\.sh|v6\.nossl\.sh|s\.nossl\.sh)$) {
    set $cors_origin $http_origin;
  }

  location / {
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
      add_header Access-Control-Max-Age 86400;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $remote_addr;	
    proxy_set_header X-Forwarded-Proto $scheme;

  }
}
